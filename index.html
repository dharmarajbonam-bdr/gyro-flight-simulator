<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ultimate Car Racer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#gameArea{
    width:400px;
    height:100vh;
    background:#333;
    margin:auto;
    position:relative;
    overflow:hidden;
    border-left:5px solid white;
    border-right:5px solid white;
}

.line{
    position:absolute;
    width:10px;
    height:100px;
    left:195px;
    background:white;
}

.car{
    position:absolute;
    width:50px;
    height:90px;
    border-radius:10px;
}

.player{
    background:linear-gradient(45deg,#00ffff,#0077ff);
    box-shadow:0 0 25px cyan;
}

.enemy{
    background:linear-gradient(45deg,#ff0000,#ff8800);
    box-shadow:0 0 20px red;
}

#score{
    position:fixed;
    top:10px;
    left:10px;
    font-size:28px;
    color:white;
    z-index:100;
}

#startScreen{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    background:rgba(0,0,0,.9);
    z-index:200;
    text-align:center;
}

#startScreen h1{
    margin-bottom:15px;
}

#startScreen button{
    padding:15px 30px;
    font-size:20px;
    cursor:pointer;
    border:none;
    background:cyan;
    border-radius:10px;
}

.particle{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
}
</style>
</head>
<body>

<div id="score">Score: 0</div>

<div id="gameArea">
    <div id="startScreen">
        <h1>🏎️ CAR RACER</h1>
        <p>Arrow Keys to Move</p>
        <br>
        <button onclick="start()">START GAME</button>
    </div>
</div>

<script>
const gameArea = document.getElementById("gameArea");
const scoreBox = document.getElementById("score");
const startScreen = document.getElementById("startScreen");

let player = {
    speed: 6,
    score: 0,
    start: false
};

let keys = {
    ArrowUp:false,
    ArrowDown:false,
    ArrowLeft:false,
    ArrowRight:false
};

document.addEventListener("keydown",e=>{
    if(keys.hasOwnProperty(e.key))
        keys[e.key]=true;
});

document.addEventListener("keyup",e=>{
    if(keys.hasOwnProperty(e.key))
        keys[e.key]=false;
});

function start(){

    startScreen.style.display="none";

    gameArea.innerHTML="";

    player.start=true;
    player.score=0;
    player.speed=6;

    for(let i=0;i<5;i++){
        let roadLine=document.createElement("div");
        roadLine.classList.add("line");
        roadLine.y=(i*150);
        roadLine.style.top=roadLine.y+"px";
        gameArea.appendChild(roadLine);
    }

    let car=document.createElement("div");
    car.classList.add("car","player");

    car.style.left="175px";
    car.style.top="500px";

    gameArea.appendChild(car);

    player.x=car.offsetLeft;
    player.y=car.offsetTop;

    car.setAttribute("id","playerCar");

    for(let x=0;x<4;x++){
        let enemy=document.createElement("div");
        enemy.classList.add("car","enemy");

        enemy.y=((x+1)*-250);

        enemy.style.left=(Math.floor(Math.random()*350))+"px";
        enemy.style.top=enemy.y+"px";

        gameArea.appendChild(enemy);
    }

    window.requestAnimationFrame(gamePlay);
}

function moveLines() {

    let lines=document.querySelectorAll(".line");

    lines.forEach(item=>{

        if(item.y>=700)
            item.y-=750;

        item.y+=player.speed*1.5;

        item.style.top=item.y+"px";
    });
}

function createSpark(x,y){

    for(let i=0;i<20;i++){

        let p=document.createElement("div");
        p.classList.add("particle");

        let size=Math.random()*8+4;

        p.style.width=size+"px";
        p.style.height=size+"px";

        p.style.background=
        `hsl(${Math.random()*60},100%,50%)`;

        p.style.left=x+"px";
        p.style.top=y+"px";

        gameArea.appendChild(p);

        let dx=(Math.random()-0.5)*10;
        let dy=(Math.random()-0.5)*10;

        let life=30;

        let interval=setInterval(()=>{

            x+=dx;
            y+=dy;

            p.style.left=x+"px";
            p.style.top=y+"px";

            p.style.opacity=life/30;

            life--;

            if(life<=0){
                clearInterval(interval);
                p.remove();
            }

        },16);
    }
}

function isCollide(a,b){

    a=a.getBoundingClientRect();
    b=b.getBoundingClientRect();

    return !(
        a.bottom < b.top ||
        a.top > b.bottom ||
        a.right < b.left ||
        a.left > b.right
    );
}

function moveEnemy(car){

    let enemy=document.querySelectorAll(".enemy");

    enemy.forEach(item=>{

        if(isCollide(car,item)){

            createSpark(
                item.offsetLeft+20,
                item.offsetTop+20
            );

            player.start=false;

            startScreen.style.display="flex";
            startScreen.innerHTML=`
            <h1>💥 GAME OVER</h1>
            <h2>Score : ${player.score}</h2>
            <br>
            <button onclick="location.reload()">
            Play Again
            </button>`;
        }

        if(item.y>=750){

            item.y=-300;
            item.style.left=
            Math.floor(Math.random()*350)+"px";
        }

        item.y+=player.speed;

        item.style.top=item.y+"px";
    });
}

function gamePlay(){

    let car=document.getElementById("playerCar");

    let road=gameArea.getBoundingClientRect();

    if(player.start){

        moveLines();
        moveEnemy(car);

        if(keys.ArrowLeft && player.x>0)
            player.x-=player.speed+2;

        if(keys.ArrowRight && player.x<350)
            player.x+=player.speed+2;

        if(keys.ArrowUp && player.y>0)
            player.y-=player.speed;

        if(keys.ArrowDown && player.y<road.height-100)
            player.y+=player.speed;

        car.style.left=player.x+"px";
        car.style.top=player.y+"px";

        player.score++;

        if(player.score%1000===0){
            player.speed+=0.5;
        }

        scoreBox.innerHTML=
        "Score: "+player.score;

        requestAnimationFrame(gamePlay);
    }
}
</script>

</body>
</html>
