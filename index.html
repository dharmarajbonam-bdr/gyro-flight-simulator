<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Breakout Game</title>

<style>
body{
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

canvas{
    background:#000;
    border:3px solid #fff;
    box-shadow:0 0 30px cyan;
}
</style>
</head>
<body>

<canvas id="gameCanvas" width="900" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;

// Paddle
const paddle = {
    width: 140,
    height: 15,
    x: canvas.width / 2 - 70,
    y: canvas.height - 30,
    speed: 10
};

// Ball
const ball = {
    x: canvas.width / 2,
    y: canvas.height - 50,
    radius: 12,
    dx: 5,
    dy: -5
};

const keys = {
    left:false,
    right:false
};

// Bricks
const brickRows = 6;
const brickCols = 10;
const brickWidth = 80;
const brickHeight = 25;
const brickPadding = 10;
const brickOffsetTop = 50;
const brickOffsetLeft = 25;

const bricks = [];

for(let r=0;r<brickRows;r++){
    bricks[r]=[];
    for(let c=0;c<brickCols;c++){
        bricks[r][c]={
            x:0,
            y:0,
            status:1,
            color:`hsl(${r*60},80%,60%)`
        };
    }
}

document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft") keys.left=true;
    if(e.key==="ArrowRight") keys.right=true;
});

document.addEventListener("keyup",e=>{
    if(e.key==="ArrowLeft") keys.left=false;
    if(e.key==="ArrowRight") keys.right=false;
});

function drawBall(){
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);
    ctx.fillStyle="cyan";
    ctx.shadowBlur=25;
    ctx.shadowColor="cyan";
    ctx.fill();
    ctx.closePath();
    ctx.shadowBlur=0;
}

function drawPaddle(){
    ctx.fillStyle="#00ff88";
    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
    );
}

function drawBricks(){

    for(let r=0;r<brickRows;r++){

        for(let c=0;c<brickCols;c++){

            if(bricks[r][c].status){

                let brickX =
                    c*(brickWidth+brickPadding)
                    + brickOffsetLeft;

                let brickY =
                    r*(brickHeight+brickPadding)
                    + brickOffsetTop;

                bricks[r][c].x=brickX;
                bricks[r][c].y=brickY;

                ctx.fillStyle=bricks[r][c].color;

                ctx.fillRect(
                    brickX,
                    brickY,
                    brickWidth,
                    brickHeight
                );
            }
        }
    }
}

function drawScore(){
    ctx.fillStyle="white";
    ctx.font="24px Arial";
    ctx.fillText("Score: "+score,20,30);
}

function collisionDetection(){

    for(let r=0;r<brickRows;r++){

        for(let c=0;c<brickCols;c++){

            let b=bricks[r][c];

            if(b.status){

                if(
                    ball.x > b.x &&
                    ball.x < b.x + brickWidth &&
                    ball.y > b.y &&
                    ball.y < b.y + brickHeight
                ){
                    ball.dy = -ball.dy;
                    b.status = 0;
                    score++;

                    if(score === brickRows*brickCols){

                        alert("🏆 You Win!");
                        document.location.reload();
                    }
                }
            }
        }
    }
}

function update(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawBricks();
    drawBall();
    drawPaddle();
    drawScore();

    collisionDetection();

    ball.x += ball.dx;
    ball.y += ball.dy;

    if(
        ball.x + ball.radius > canvas.width ||
        ball.x - ball.radius < 0
    ){
        ball.dx = -ball.dx;
    }

    if(ball.y - ball.radius < 0){
        ball.dy = -ball.dy;
    }

    if(
        ball.y + ball.radius >
        paddle.y &&
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.width
    ){
        ball.dy = -ball.dy;
    }

    if(ball.y > canvas.height){
        alert("💀 Game Over!");
        document.location.reload();
    }

    if(keys.left && paddle.x > 0){
        paddle.x -= paddle.speed;
    }

    if(
        keys.right &&
        paddle.x + paddle.width < canvas.width
    ){
        paddle.x += paddle.speed;
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
